server:
  port: 8080

spring:
  application:
    name: end
  datasource:
    url: jdbc:mysql://localhost:3306/vue_user?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: "123456"
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: Asia/Shanghai

mybatis:
  mapper-locations: classpath:/mapper/*Mapper.xml
  type-aliases-package: com.example.end.entity
  configuration:
    map-underscore-to-camel-case: true

jwt:
  secret: vue-user-secret-key-2026
  expire-hours: 24
